# Publishes the security rules (Firestore + Storage) to Firebase whenever they change. Needed no matter where the website is hosted.
# One-time setup (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   Variable  FIREBASE_PROJECT_ID        e.g. my-temple-accounts
#   Secret    FIREBASE_SERVICE_ACCOUNT   the full JSON of a service-account key (Firebase console -> Project settings -> Service accounts)
name: Deploy Firebase rules
on:
  push:
    branches: [main, firebase]
    paths: ["firebase/**", "firebase.json"]
  workflow_dispatch: {}
concurrency: deploy-rules
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Deploy rules
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools deploy --only firestore:rules,firestore:indexes,storage --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

# Checks every push and pull request: lint, types, the pure-function tests, the row level
# security tests against a real PostgreSQL, and a production build.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24+ runs the TypeScript sources directly, which the unit tests rely on.
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Row level security tests
        run: npm run test:rls

      - name: Build
        run: npm run build
        env:
          # Enough for the build to succeed; the real values live in the host's settings.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
